<!-- Subscription Alert Modal -->
<div id="subscriptionAlertModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-yellow-100">
                <i class="fas fa-exclamation-triangle text-yellow-600 text-xl"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mt-4" id="alertTitle">Plan Limit Reached</h3>
            <div class="mt-2 px-7 py-3">
                <p class="text-sm text-gray-500" id="alertMessage">
                    Your current plan has reached its limit for this feature.
                </p>
            </div>
            <div class="items-center px-4 py-3">
                <button id="upgradeBtn" class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
                    Upgrade Plan
                </button>
                <button id="closeAlertBtn" class="mt-3 px-4 py-2 bg-gray-300 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Subscription Alert Functions
function showSubscriptionAlert(title, message, upgradeUrl = '/pricing/') {
    const modal = document.getElementById('subscriptionAlertModal');
    const titleEl = document.getElementById('alertTitle');
    const messageEl = document.getElementById('alertMessage');
    const upgradeBtn = document.getElementById('upgradeBtn');
    const closeBtn = document.getElementById('closeAlertBtn');
    
    titleEl.textContent = title;
    messageEl.textContent = message;
    
    upgradeBtn.onclick = function() {
        window.location.href = upgradeUrl;
    };
    
    closeBtn.onclick = function() {
        modal.classList.add('hidden');
    };
    
    // Close on outside click
    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.classList.add('hidden');
        }
    };
    
    modal.classList.remove('hidden');
}

// Check subscription limits before form submission
function checkSubscriptionLimit(formId, limitType, currentCount, maxAllowed, planName) {
    const form = document.getElementById(formId);
    if (!form) return;
    
    form.addEventListener('submit', function(e) {
        if (maxAllowed !== -1 && currentCount >= maxAllowed) {
            e.preventDefault();
            
            let featureName = '';
            let upgradeMessage = '';
            
            switch(limitType) {
                case 'employees':
                    featureName = 'Employee';
                    upgradeMessage = `Your ${planName} plan allows ${maxAllowed} employees. You currently have ${currentCount} employees.`;
                    break;
                case 'branches':
                    featureName = 'Branch';
                    upgradeMessage = `Your ${planName} plan allows ${maxAllowed} branches. You currently have ${currentCount} branches.`;
                    break;
                case 'attendance_groups':
                    featureName = 'Attendance Group';
                    upgradeMessage = `Your ${planName} plan allows ${maxAllowed} attendance groups. You currently have ${currentCount} groups.`;
                    break;
                default:
                    featureName = 'Feature';
                    upgradeMessage = `Your ${planName} plan has reached its limit for this feature.`;
            }
            
            showSubscriptionAlert(
                `${featureName} Limit Reached`,
                `${upgradeMessage} Please upgrade your plan to add more ${limitType}.`
            );
        }
    });
}

// Auto-check limits on page load
document.addEventListener('DOMContentLoaded', function() {
    // Check if we have subscription data in the page
    const subscriptionData = window.subscriptionLimits;
    if (subscriptionData) {
        // Check employee creation forms
        checkSubscriptionLimit(
            'employeeCreateForm',
            'employees',
            subscriptionData.currentEmployees,
            subscriptionData.maxEmployees,
            subscriptionData.planName
        );
        
        // Check branch creation forms
        checkSubscriptionLimit(
            'branchCreateForm',
            'branches',
            subscriptionData.currentBranches,
            subscriptionData.maxBranches,
            subscriptionData.planName
        );
        
        // Check attendance group creation forms
        checkSubscriptionLimit(
            'attendanceGroupCreateForm',
            'attendance_groups',
            subscriptionData.currentGroups,
            subscriptionData.maxGroups,
            subscriptionData.planName
        );
    }
});
</script>
